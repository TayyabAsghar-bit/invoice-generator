    <script>
      // Safeguard for iframe sandboxes where window.fetch has only a getter
      (function () {
        try {
          var originalFetch = window.fetch;
          var fetchHolder = originalFetch ? originalFetch.bind(window) : undefined;
          try {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return fetchHolder || originalFetch;
              },
              set: function (newFetch) {
                fetchHolder = newFetch;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (e1) {
            try {
              if (window.Window && Window.prototype) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function () {
                    return fetchHolder || originalFetch;
                  },
                  set: function (newFetch) {
                    fetchHolder = newFetch;
                  },
                  configurable: true,
                  enumerable: true,
                });
              }
            } catch (e2) {}
          }
        } catch (err) {
          // Fail safely
        }
      })();
    </script>
